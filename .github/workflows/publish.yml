name: Publish to Maven Central

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish all modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Import key into the runner's gpg keyring.
      # The action handles passphrase, trust, and gpg-agent setup automatically.
      # Its output `keyid` is the fingerprint we pass to Gradle as signing.gnupg.keyName.
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.SIGNING_KEY }}
          passphrase: ${{ secrets.SIGNING_PASSWORD }}

      - name: Show imported key
        run: gpg --list-secret-keys --keyid-format LONG

      - name: Publish to Maven Central
        run: >
          ./gradlew publishAllPublicationsToMavenCentralRepository
          --no-configuration-cache
          --no-daemon
          --stacktrace
          -Psigning.gnupg.keyName=${{ steps.import_gpg.outputs.fingerprint }}
          -Psigning.gnupg.passphrase=${{ secrets.SIGNING_PASSWORD }}
        env:
          CI: "true"
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
