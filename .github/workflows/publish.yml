name: Publish to Maven Central

# Triggers on a pushed Git tag like v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish all modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Import the GPG key into the runner's keyring.
      # This action handles multi-line key, passphrase prompt, and sets
      # the key as trusted — needed so gpg won't reject it during signing.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.SIGNING_KEY }}
          passphrase: ${{ secrets.SIGNING_PASSWORD }}

      # Sanity-check: confirm the key ID secret matches what was imported.
      - name: Verify GPG key is present
        run: |
          echo "Imported keys:"
          gpg --list-secret-keys --keyid-format SHORT
          echo ""
          echo "Expected key ID: ${{ secrets.SIGNING_KEY_ID }}"

      - name: Publish to Maven Central
        run: >
          ./gradlew publishAllPublicationsToMavenCentralRepository
          --no-configuration-cache
          --no-daemon
          --stacktrace
        env:
          CI: "true"
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
