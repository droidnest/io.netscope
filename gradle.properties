# Project-wide Gradle settings

# Version ? bump this for each release, must match build.gradle.kts coordinates()
VERSION_NAME=0.7.0

# Maven coordinates (used by vanniktech as fallback if coordinates() is absent)
GROUP=io.github.droidnest

# Android build
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# Performance
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.disallowKotlinSourceSets=false

# Signing — DO NOT set signing.skip=true; Maven Central requires signed artifacts.
# gradle.properties does NOT support shell variable expansion — never write
# signingInMemoryKey=$ORG_GRADLE_PROJECT_xxx here; that sets the property to the
# literal string and breaks signing.
#
# Signing is supplied exclusively via CI environment variables:
#   ORG_GRADLE_PROJECT_signingInMemoryKey       ← secrets.SIGNING_KEY
#   ORG_GRADLE_PROJECT_signingInMemoryKeyId     ← secrets.SIGNING_KEY_ID
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword ← secrets.SIGNING_PASSWORD
#
# For local publishing, add the real values to ~/.gradle/gradle.properties (never commit that file).