# Project-wide Gradle settings

# Version — bump this for each release, must match build.gradle.kts coordinates()
VERSION_NAME=0.3.0

# Maven coordinates (used by vanniktech as fallback if coordinates() is absent)
GROUP=io.github.nidhal92

# Android build
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# Performance
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.disallowKotlinSourceSets=false

# Signing — DO NOT set signing.skip=true; Maven Central requires signed artifacts.
# Local signing is configured via ~/.gradle/gradle.properties (never commit that file).
# CI signing uses ORG_GRADLE_PROJECT_signingInMemoryKey* environment variables.
